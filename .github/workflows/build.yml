name: Cucina ROM per Galaxy A71

on:
  workflow_dispatch: # Ti permette di avviare la build manualmente con un click

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Installazione Dipendenze del Server
      run: |
        sudo apt update
        sudo apt install -y axel bzip2 aria2 brotli p7zip-full openjdk-17-jre python3 python3-pip

    - name: Download delle ROM (Base e Port)
      run: |
        # SOSTITUISCI QUESTI LINK CON I LINK DIRETTI SUL WEB DEI TUOI ZIP
        # Sostituisci il link qui sotto con una ROM AOSP stabile per A71
        aria2c -s 10 -x 10 -o base.zip "LINK_ROM_BASE_A71"
        # Sostituisci il link qui sotto con la ROM di mistOS che vuoi usare come port
        aria2c -s 10 -x 10 -o port.zip "LINK_ROM_MISTOS"

    - name: Estrazione e Mix (Il Trapianto)
      run: |
        mkdir base_extracted port_extracted output_rom
        
        # Scompatta le ROM
        unzip base.zip -d base_extracted/
        unzip port.zip -d port_extracted/
        
        # NOTA: Qui inseriremo i comandi per unire i file.
        # Ad esempio, per iniziare a copiare la base dell'A71 nella cartella finale:
        cp -r base_extracted/* output_rom/
        
        # Sostituzione del sistema (Esempio logico: sovrascriviamo le app di mistOS)
        # cp -r port_extracted/system/app/* output_rom/system/app/
        # cp -r port_extracted/system/priv-app/* output_rom/system/priv-app/

    - name: Impacchettamento Zip Finale
      run: |
        cd output_rom
        zip -r ../mistOS_A71_Port.zip ./*
        cd ..

    - name: Carica lo Zip nei file della Build
      uses: actions/upload-artifact@v4
      with:
        name: mistOS-GalaxyA71
        path: mistOS_A71_Port.zip
