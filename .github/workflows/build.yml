name: Cucina AxionAOSP per Galaxy A71

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Installazione Dipendenze
      run: |
        sudo apt update
        sudo apt install -y axel bzip2 aria2 brotli p7zip-full openjdk-17-jre python3 python3-pip wget
        # Scarichiamo il dumper per i payload delle ROM moderne
        wget https://github.com/ssut/payload-dumper-go/releases/download/1.2.2/payload-dumper-go_1.2.2_linux_amd64.tar.gz
        tar -xvzf payload-dumper-go_1.2.2_linux_amd64.tar.gz
        sudo mv payload-dumper-go /usr/local/bin/

    - name: Download delle ROM
      run: |
        mkdir -p workspace/base workspace/port
        echo "Scarico la BASE (Evolution X)..."
        curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o workspace/base/base.zip "https://cdn.evolution-x.org/a71/16/EvolutionX-16.0-20260325-a71-11.6.2-Official.zip"
        echo "Scarico il PORT (AxionAOSP)..."
        curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -o workspace/port/port.zip "https://cdn.axionos.org/raphael/axion-2.5-REVERIE-20260407225317-OFFICIAL-GMS-raphael.zip"

    - name: Estrazione e Analisi File
      run: |
        echo "Scompatto la ROM Base (A71)..."
        7z x workspace/base/base.zip -oworkspace/base_extracted
        
        echo "Scompatto la ROM Port (K20 Pro)..."
        7z x workspace/port/port.zip -oworkspace/port_extracted
        
        echo "Ecco cosa c'è dentro le cartelle:"
        echo "--- BASE ---"
        ls -la workspace/base_extracted/
        echo "--- PORT ---"
        ls -la workspace/port_extracted/
