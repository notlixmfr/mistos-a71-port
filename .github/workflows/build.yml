name: Cucina ROM per Galaxy A71

on:
  workflow_dispatch:

jobs:
  build-rom:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del codice
      uses: actions/checkout@v4

    - name: Installazione Dipendenze
      run: |
        sudo apt update
        sudo apt install -y axel bzip2 aria2 brotli p7zip-full openjdk-17-jre python3 python3-pip

    - name: Download e Test
      run: |
        echo "Il server e pronto per cucinare!"
